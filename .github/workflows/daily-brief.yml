name: Daily Briefing

# Goal: today's brief is published and complete before 6:00 AM Eastern, every day.
#
# GitHub cron is UTC-only and best-effort (runs can start late), so this uses
# several attempts plus a completeness check instead of one fragile run.
# Every time below is chosen against the 6:00 AM deadline in BOTH seasons:
#   10:00 UTC = 6:00 AM EDT (summer) = 5:00 AM EST (winter)
# so the schedule never needs editing when clocks change (in winter the brief
# is simply done an hour earlier than required).
#
#   07:23 UTC  primary run        (3:23 AM EDT / 2:23 AM EST)
#   08:29 UTC  check, rebuild if incomplete
#   09:09 UTC  check, rebuild if incomplete (last attempt that can finish in time)
#   09:57 UTC  deadline check: if still incomplete, tries a late build AND
#              fails the run on purpose so GitHub emails you
#
# Minutes are deliberately off :00/:30 -- those are the busiest scheduler slots.
on:
  schedule:
    - cron: "23 7 * * *"
    - cron: "29 8 * * *"
    - cron: "9 9 * * *"
    - cron: "57 9 * * *"
  workflow_dispatch: {}   # manual run: always forces a full refetch + rebuild

permissions:
  contents: write

# One run at a time so two attempts can never collide on git push.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Is today's brief already complete? "Complete" means:
  #   - docs/index.html is stamped with today's (UTC) date, AND
  #   - data/<date>/synthesis.json exists with a non-empty BLUF
  # (an empty BLUF means the Claude synthesis step failed, which is the
  # failure you'd otherwise miss because those steps are continue-on-error).
  # have_raw = raw article files for today are already on disk, so a retry
  # can skip re-spending NewsAPI/newsdata requests and only redo the rest.
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.c.outputs.complete }}
      have_raw: ${{ steps.c.outputs.have_raw }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          D=$(date -u +%F)
          complete=false
          have_raw=false

          if [ -f "data/$D/synthesis.json" ] \
             && jq -e '(.bluf // "") | length > 0' "data/$D/synthesis.json" >/dev/null 2>&1 \
             && grep -q "$D" docs/index.html 2>/dev/null; then
            complete=true
          fi

          # NB: GitHub runs this with -e -o pipefail. On a new UTC day data/$D does not
          # exist yet, so a bare `ls | wc` would kill this step (and skip the whole build).
          raw=$( (ls "data/$D"/*.json 2>/dev/null || true) | wc -l )
          if [ "$raw" -ge 15 ]; then have_raw=true; fi

          # A manual run means "do it all again, fresh".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            complete=false
            have_raw=false
          fi

          echo "date=$D complete=$complete raw_files=$raw have_raw=$have_raw"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "have_raw=$have_raw" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The pipeline itself (unchanged logic). Skipped when today is already done.
  # ---------------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Skipped on a retry when today's raw data is already in the repo.
      - name: Fetch NewsAPI data
        if: needs.check.outputs.have_raw != 'true'
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python scripts/fetch_news.py

      - name: Fetch newsdata.io data (second source, merged by topic)
        if: needs.check.outputs.have_raw != 'true'
        continue-on-error: true
        env:
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
        run: python scripts/fetch_newsdata.py

      - name: Red team - verify article relevance, reassign topics, tag COCOM
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/redteam.py

      - name: Detect duplicate/contradictory reporting per topic
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/dedupe_stories.py

      - name: Rank stories + detect changes vs. archive (audit files)
        continue-on-error: true
        run: python scripts/rank_day.py

      - name: Generate BLUF + per-topic narrative synthesis
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/synthesize.py

      - name: Build briefing page
        run: python scripts/build_brief.py

      - name: Build archive index + trend CSVs
        continue-on-error: true
        run: python scripts/archive.py

      # if: always() so fetched data is saved even if a later step failed.
      # pull --rebase first so a push of your own mid-run can't reject this one.
      - name: Commit and push updated data + page
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --quiet --cached || git commit -m "Daily briefing update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push

  # ---------------------------------------------------------------------------
  # Deadline alarm. Only the 09:57 UTC run does this. If the brief was not
  # complete when that check started, the build job above has already tried
  # a late build in the same run; this job then fails the run on purpose so
  # GitHub sends you a failed-workflow notification.
  # ---------------------------------------------------------------------------
  deadline-alert:
    needs: [check, build]
    if: always() && github.event.schedule == '57 9 * * *' && needs.check.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Daily brief was NOT complete at the 6:00 AM ET deadline check. A late build was attempted in this run - see the build job for whether it succeeded."
          exit 1
